<div class="detail-page">
  <!-- Header -->
  <div class="page-header">
    <button class="btn btn-back" (click)="goBack()">← Danh sách</button>
    <h1 *ngIf="mode === 'view'">Chi tiết Fashion</h1>
    <h1 *ngIf="mode === 'edit'">Chỉnh sửa Fashion</h1>
    <h1 *ngIf="mode === 'create'">Thêm Fashion mới</h1>
    <span></span>
  </div>

  <!-- Loading -->
  <div class="loading" *ngIf="loading">
    <div class="spinner"></div>
    <p>Đang tải...</p>
  </div>

  <!-- Error -->
  <div class="alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <!-- VIEW MODE -->
  <div class="view-container" *ngIf="!loading && mode === 'view'">
    <div class="view-layout">
      <div class="view-thumb">
        <img
          [src]="fashion.thumbnail || 'https://via.placeholder.com/400x500?text=No+Image'"
          [alt]="fashion.fashion_title"
        />
      </div>
      <div class="view-info">
        <span class="style-tag">{{ fashion.fashion_style }}</span>
        <h2>{{ fashion.fashion_title }}</h2>
        <p class="date">Ngày tạo: {{ formatDate(fashion.creation_date) }}</p>
        <div class="fashion-details-html" [innerHTML]="safeDetails"></div>
      </div>
    </div>
  </div>

  <!-- CREATE / EDIT FORM -->
  <div class="form-container" *ngIf="!loading && (mode === 'create' || mode === 'edit')">
    <div class="form-group">
      <label>Tiêu Fashion <span class="required">*</span></label>
      <input type="text" [(ngModel)]="fashion.fashion_title" placeholder="Nhập tiêu fashion..." />
    </div>

    <div class="form-group">
      <label>Style <span class="required">*</span></label>
      <div class="style-row">
        <select [(ngModel)]="fashion.fashion_style">
          <option value="">-- Chọn Style --</option>
          <option *ngFor="let s of styles" [value]="s">{{ s }}</option>
        </select>
        <input
          type="text"
          [(ngModel)]="fashion.fashion_style"
          placeholder="Hoặc nhập Style mới..."
        />
      </div>
    </div>

    <div class="form-group">
      <label>Thumbnail URL</label>
      <input
        type="text"
        [(ngModel)]="fashion.thumbnail"
        placeholder="https://example.com/image.jpg"
      />
      <div class="thumb-preview" *ngIf="fashion.thumbnail">
        <img [src]="fashion.thumbnail" alt="preview" />
      </div>
    </div>

    <div class="form-group">
      <label>Chi tiết Fashion (HTML - WYSIWYG)</label>
      <div class="wysiwyg-toolbar">
        <button
          type="button"
          (click)="fashion.fashion_details = fashion.fashion_details + '<b>Bold</b>'"
        >
          B
        </button>
        <button
          type="button"
          (click)="fashion.fashion_details = fashion.fashion_details + '<i>Italic</i>'"
        >
          <i>I</i>
        </button>
        <button
          type="button"
          (click)="fashion.fashion_details = fashion.fashion_details + '<ul><li>Item</li></ul>'"
        >
          List
        </button>
        <button
          type="button"
          (click)="fashion.fashion_details = fashion.fashion_details + '<p></p>'"
        >
          P
        </button>
        <button
          type="button"
          (click)="fashion.fashion_details = fashion.fashion_details + '<h3>Heading</h3>'"
        >
          H3
        </button>
      </div>
      <textarea
        [(ngModel)]="fashion.fashion_details"
        rows="10"
        placeholder="Nhập nội dung HTML cho fashion..."
      ></textarea>
      <div class="preview-label">Preview:</div>
      <div class="html-preview" [innerHTML]="fashion.fashion_details"></div>
    </div>

    <div class="form-actions">
      <button class="btn btn-cancel" (click)="goBack()">Hủy</button>
      <button class="btn btn-save" (click)="save()" [disabled]="saving">
        <span *ngIf="!saving">✓ Lưu</span>
        <span *ngIf="saving">Đang lưu...</span>
      </button>
    </div>
  </div>
</div>
